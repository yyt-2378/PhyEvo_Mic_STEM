name: tests

on:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.6.0"
          python -m pip install -e ".[dev,review,learning,benchmark,fourdstem,paper]" "numpy==1.26.4" "networkx>=2.8,<4"
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTHONPATH: "src:."
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
        run: |
          mkdir -p .codex-tmp
          verification_dir=$(mktemp -d "$PWD/.codex-tmp/ci-XXXXXXXX")
          export TMPDIR="$verification_dir"
          export MPLCONFIGDIR="$verification_dir/matplotlib"
          python scripts/check_source_release.py --profile syntax
          python -m pytest -q -ra -p no:cacheprovider --basetemp "$verification_dir/tests" --junitxml "$verification_dir/junit.xml" \
            --deselect=tests/test_author_pretrained.py::test_native_postprocessing_matches_published_functions \
            --deselect=tests/test_emseek_author_pretrained.py::test_official_preprocessing_identical_non_square_input
