task: atomic_point_defect

preprocess:
  lower_percentile: 0.5
  upper_percentile: 99.5
  background_sigma: 0.0

spectral:
  min_frequency: 0.02
  max_frequency: 0.38
  global_peak_count: 16
  global_peak_min_separation: 0.01

atomic:
  polarity: auto
  peak_sigma: 1.2
  peak_min_distance: 4
  peak_threshold_quantile: 0.72
  matching_tolerance_fraction: 0.34
  site_anomaly_z: 3.5
  displacement_z: 3.0
  minimum_reference_sites: 16
  render_radius_fraction: 0.28
  offset_search_steps: 24
  max_auto_sublattices: 4
  fractional_histogram_bins: 32
  nonrigid_smoothing_cells: 4.0
  nonrigid_iterations: 2
  minimum_displacement_fraction: 0.12

output:
  save_feature_maps: true
  save_numpy_arrays: true
  figure_dpi: 160
