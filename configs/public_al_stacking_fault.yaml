task: stacking_fault

preprocess:
  lower_percentile: 0.5
  upper_percentile: 99.5
  background_sigma: 0.0

spectral:
  min_frequency: 0.02
  max_frequency: 0.38
  global_peak_count: 16
  global_peak_min_separation: 0.01

line_defect:
  frequency_filter_sigma: 0.006
  derivative_smoothing_sigma: 6.0
  score_smoothing_sigma: 5.0
  threshold_quantile: 0.99
  threshold_mad: 3.5
  minimum_coherence: 0.30
  morphology_radius: 2
  minimum_region_area: 80
  valid_border_margin: 16

output:
  save_feature_maps: true
  save_numpy_arrays: true
  figure_dpi: 160
