catalog_version: "1.2.0"
audited_on: "2026-07-29"
scope: public_STEM_TEM_sources_for_defect_ontology_expansion
catalog_only: true
note: >-
  This file records candidates and does not admit any asset into a train,
  calibration, development_test, or locked_external_test partition. Admission
  still requires a sealed intake plan, immutable revision, file checksums,
  provenance audit, and group-level split decision.

governance:
  default_partition_after_label_or_sample_inspection: train_or_development
  public_author_labels_are_gold: false
  unresolved_license_action: quarantine
  future_pristine_locked_test_policy: >-
    Discover and seal a separate source before downloading images or opening
    labels. None of the sources catalogued below should be advertised as a new
    pristine locked test after it has influenced ontology or method design.
  dataset_protection: never_delete_or_overwrite_source_assets
  required_before_download:
    - verify_data_license_not_only_code_license
    - freeze_canonical_url_and_revision_or_doi_version
    - record_expected_bytes_and_checksums_when_available
    - define_acquisition_sample_lab_and_microscope_groups
    - define_annotation_qualification_and_control_role

intake_tiers:
  A: label_ready_or_nearly_label_ready
  B: evidence_rich_raw_data_requiring_expert_adapter_or_relabel
  C: unlabeled_diversity_self_supervision_or_ood
  D: simulation_or_digital_twin
  H: historical_only_not_reusable

