<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" role="img" aria-labelledby="title desc">
  <title id="title">PhyEvo-Mic-RSI：从电镜分析到能力进化</title>
  <desc id="desc">分析层从显微输入和结构参考生成物理证据与候选，并接收专家反馈。研究层完成诊断、可执行提案、隔离执行、固定协议评价和准入。能力库、学生状态、采用规则与研究经验共同继承，供下一轮研究和按配置启用的分析调用。学生训练为可选研究动作。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#55748b"/></marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10Z" fill="#087f80"/></marker>
    <style>
      text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#18344d}
      .title{font-size:44px;font-weight:700}
      .subtitle{font-size:25px;fill:#536d7e}
      .lane{font-size:27px;font-weight:700;fill:#087f80}
      .head{font-size:27px;font-weight:700}
      .body{font-size:24px}
      .step{font-size:22px}
      .note{font-size:21px;fill:#536d7e}
      .card{fill:#fff;stroke:#d0dee6;stroke-width:1.5}
      .flow{fill:none;stroke:#55748b;stroke-width:3;marker-end:url(#arrow);stroke-linejoin:round}
      .loop{fill:none;stroke:#087f80;stroke-width:3;marker-end:url(#loop-arrow);stroke-linejoin:round}
      .dash{stroke-dasharray:9 7}
      .white{fill:#fff}
      .light{fill:#d4e9ed}
    </style>
  </defs>
  <rect width="1480" height="1100" fill="#fff"/>
  <rect x="48" y="34" width="7" height="76" rx="3" fill="#087f80"/>
  <text x="76" y="69" class="title">PhyEvo-Mic-RSI：从电镜分析到能力进化</text>
  <text x="76" y="108" class="subtitle">物理证据 × 专家反馈 × 学生学习 × 可执行研究迭代</text>

  <rect x="40" y="150" width="1400" height="262" rx="20" fill="#f0f5f9"/>
  <text x="64" y="188" class="lane">分析层　理解图像，并积累研究者反馈</text>
  <rect x="64" y="210" width="420" height="174" rx="14" class="card"/>
  <text x="84" y="250" class="head">显微输入与结构参考</text>
  <text x="84" y="292" class="body">图像、采集信息与可选 CIF 模板</text>
  <text x="84" y="328" class="body">归一化、配准与尺度记录</text>
  <text x="84" y="363" class="note">保留来源与原始空间坐标</text>
  <path d="M484 300 H520" class="flow"/>

  <rect x="530" y="210" width="420" height="174" rx="14" class="card"/>
  <text x="550" y="250" class="head">物理分析与可选学习能力</text>
  <text x="550" y="292" class="body">晶格、频谱、相位、对称性</text>
  <text x="550" y="328" class="body">预训练特征 / 专家监督学生</text>
  <text x="550" y="363" class="note">输出点、线、界面、区域与证据</text>
  <path d="M950 300 H985" class="flow"/>

  <rect x="995" y="210" width="420" height="174" rx="14" fill="#fff6e9" stroke="#e4bc84" stroke-width="1.5"/>
  <text x="1015" y="250" class="head">结果查看与专家反馈</text>
  <text x="1015" y="292" class="body">候选查看与几何修正</text>
  <text x="1015" y="328" class="body">接受、修正、拒绝或不确定</text>
  <text x="1015" y="363" class="note">保存意见、版本与输入来源</text>

  <text x="65" y="441" class="note">研究依据：开发侧观测、专家修正、分支分歧与历史反馈</text>

  <rect x="40" y="476" width="1400" height="312" rx="20" fill="#eff8f5"/>
  <text x="64" y="514" class="lane">研究层　RSI 提出、执行、评价并继承改进</text>
  <rect x="60" y="540" width="248" height="210" rx="14" class="card"/>
  <text x="78" y="583" class="head">01 研究诊断</text>
  <text x="78" y="628" class="step">发现当前能力缺口</text>
  <text x="78" y="664" class="step">结合证据与研究经验</text>
  <text x="78" y="720" class="note">确定下一步研究方向</text>
  <path d="M308 632 H329" class="flow"/>

  <rect x="338" y="540" width="248" height="210" rx="14" class="card"/>
  <text x="356" y="583" class="head">02 可执行提案</text>
  <text x="356" y="628" class="step">生成程序与采用条件</text>
  <text x="356" y="664" class="step">新增 / 改进 / 组合</text>
  <text x="356" y="720" class="note">学生训练为可选动作</text>
  <path d="M586 632 H607" class="flow"/>

  <rect x="616" y="540" width="248" height="210" rx="14" class="card"/>
  <text x="634" y="583" class="head">03 隔离执行</text>
  <text x="634" y="628" class="step">运行候选分析程序</text>
  <text x="634" y="664" class="step">按需执行学生训练</text>
  <text x="634" y="720" class="note">记录代码与数值状态</text>
  <path d="M864 632 H885" class="flow"/>

  <rect x="894" y="540" width="248" height="210" rx="14" class="card"/>
  <text x="912" y="583" class="head">04 评价与选择</text>
  <text x="912" y="628" class="step">同协议 / 同候选预算</text>
  <text x="912" y="664" class="step">新收益与旧能力保留</text>
  <text x="912" y="720" class="note">评价组合后的系统</text>
  <path d="M1142 632 H1163" class="flow"/>

  <rect x="1172" y="540" width="248" height="210" rx="14" fill="#dff1e8" stroke="#76aa93" stroke-width="1.5"/>
  <text x="1190" y="583" class="head">05 准入与继承</text>
  <text x="1190" y="628" class="step">通过：纳入并继承</text>
  <text x="1190" y="664" class="step">未通过：记录反馈</text>
  <text x="1190" y="720" class="note">保存可复用的能力</text>
  <path d="M1415 300 H1448 V452 H24 V632 H56" class="loop"/>

  <path d="M1296 750 V864" class="loop"/>
  <text x="930" y="834" class="note">更新通过评价的系统能力与研究记录</text>
  <rect x="40" y="875" width="1400" height="170" rx="20" fill="#183c52"/>
  <text x="64" y="915" class="lane white">状态层　把改进沉淀为下一轮可以实际使用的能力</text>
  <rect x="64" y="938" width="319" height="77" rx="12" fill="#285668"/>
  <rect x="408" y="938" width="319" height="77" rx="12" fill="#285668"/>
  <rect x="752" y="938" width="319" height="77" rx="12" fill="#285668"/>
  <rect x="1096" y="938" width="319" height="77" rx="12" fill="#285668"/>
  <text x="223" y="971" text-anchor="middle" class="head white">分析能力库</text>
  <text x="223" y="1002" text-anchor="middle" class="note light">新旧能力可组合复用</text>
  <text x="567" y="971" text-anchor="middle" class="head white">学生模型状态</text>
  <text x="567" y="1002" text-anchor="middle" class="note light">程序与学习状态绑定</text>
  <text x="911" y="971" text-anchor="middle" class="head white">能力采用规则</text>
  <text x="911" y="1002" text-anchor="middle" class="note light">依据可观测证据调用</text>
  <text x="1255" y="971" text-anchor="middle" class="head white">研究经验与版本</text>
  <text x="1255" y="1002" text-anchor="middle" class="note light">父子关系与实测反馈</text>

  <path d="M40 978 H24 V815 H184 V758" class="loop"/>
  <text x="65" y="844" class="note">下一轮读取并使用继承后的状态</text>
  <path d="M1440 978 H1465 V133 H740 V201" class="loop dash"/>
  <text x="64" y="1080" class="note">实线：分析、反馈与研究迭代　　虚线：按配置调用已接纳能力　　架构示意 · 2026-10-22</text>
</svg>
